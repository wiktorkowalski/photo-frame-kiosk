<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ramki</title>
  <style>
    body { margin: 0; padding: 16px; font-family: system-ui, Roboto, Arial, sans-serif; background: #f6f7f9; color: #15181d; }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    h2 { font-size: 20px; margin: 0; }
    label { display: block; margin-bottom: 16px; }
    input, select { padding: 10px; font-size: 16px; border: 1px solid #c4cad3; border-radius: 6px; background: #fff; color: inherit; }
    input { width: 100%; box-sizing: border-box; margin: 8px 0; }
    button { padding: 10px 14px; font-size: 16px; border: 1px solid #c4cad3; border-radius: 6px; background: #fff; color: inherit; }
    button.primary, button.current { background: #15181d; color: #fff; border-color: #15181d; }
    button:disabled { opacity: 0.5; }
    .frame { padding: 14px; margin-bottom: 12px; background: #fff; border: 1px solid #e1e5ea; border-radius: 8px; }
    .state { margin: 6px 0 12px; }
    .screens { display: flex; flex-wrap: wrap; gap: 8px; }
    .back { margin-top: 12px; }
    .muted { color: #5d6672; font-size: 14px; }
    .override { color: #a15c00; font-weight: 600; }
    .error { color: #b3261e; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1115; color: #e8ebef; }
      .frame { background: #171a20; border-color: #262b33; }
      input, select, button { background: #171a20; border-color: #333a44; }
      button.primary, button.current { background: #e8ebef; color: #0f1115; border-color: #e8ebef; }
      .muted { color: #9aa3ae; }
      .override { color: #f2b45a; }
      .error { color: #f2a19a; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Ramki</h1>
    <form id="login" hidden>
      <p class="muted">Wklej token sterowania. Strona zapamięta go na tym telefonie.</p>
      <input id="token" type="password" autocomplete="off" placeholder="token">
      <button class="primary" type="submit">Zapisz</button>
    </form>
    <div id="panel" hidden>
      <div class="bar">
        <label>Pokaż przez
          <select id="minutes">
            <option value="15">15 min</option>
            <option value="30" selected>30 min</option>
            <option value="60">1 h</option>
            <option value="120">2 h</option>
            <option value="240">4 h</option>
            <option value="480">8 h</option>
          </select>
        </label>
        <button id="logout" type="button">Wyloguj</button>
      </div>
      <div id="frames"></div>
    </div>
    <p id="message" class="muted"></p>
  </main>
  <script src="control.js"></script>
</body>
</html>
