name: Push screens

# Sends screens.json to the running router. The router validates it: a rejected file turns
# this run red and the frames keep the last good config.
on:
  push:
    branches: ["master"]
    paths:
      - "screens.json"
  workflow_dispatch:
  # Docker Image CI calls this after each deploy, so a new image never keeps an older pushed config.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: push-screens
  cancel-in-progress: false

jobs:
  push:
    # The runner shares the "proxy" Docker network with the router, so the container name resolves.
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v6

      - name: Send screens.json to the router
        env:
          TOKEN: ${{ secrets.FRAME_ROUTER_CONFIG_TOKEN }}
        run: |
          code=$(curl --silent --show-error --max-time 30 --output response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $TOKEN" \
            --data-binary @screens.json \
            http://frame-router:8080/api/config)
          cat response.json
          echo
          test "$code" = "200"
