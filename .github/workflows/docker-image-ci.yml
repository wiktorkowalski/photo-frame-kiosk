name: Docker Image CI

# No pull_request trigger: the build runs on the self-hosted homelab runner, and a public
# repository must never run code from a fork there.
on:
  push:
    branches: ["master"]
    paths-ignore:
      - "screens.json"
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-deploy:
    uses: wiktorkowalski/github-workflows/.github/workflows/dotnet-docker-deploy.yml@master
    with:
      image-name: wiktorkowalski/frame-router
      dockerfile: ./router/Dockerfile
      context: .
      # Empty: the Dockerfile builds and tests the .NET app itself.
      dotnet-project: ""
      # The commit goes into the app version; the frame pages reload when it changes.
      build-args: |
        GIT_SHA=${{ github.sha }}
      runner-labels: '["self-hosted", "homelab"]'
      deploy-compose-path: /home/ubuntu/docker/frame-router
      deploy-runner-labels: '["self-hosted", "homelab"]'
    secrets: inherit

  # The new router starts from the config it saved last; send the current file so both match.
  push-screens:
    needs: build-deploy
    uses: ./.github/workflows/push-screens.yml
    secrets: inherit
